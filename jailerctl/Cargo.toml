[package]
name = "jailerctl"
version = "0.1.0"
edition = "2021"
description = "CLI for managing bpfjailer"

[[bin]]
name = "jailerctl"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["process", "signal", "feature"] }
serde = { workspace = true }
serde_json = { workspace = true }
